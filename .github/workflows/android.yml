name: Build SniperGold Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24  # ✅ Changed from 20 (deprecated)
          cache: npm

      - name: Install Cordova
        run: npm install

      - name: Add Android platform
        run: npx cordova platform add android

      - name: Build debug APK
        run: npx cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snipergold-v10-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk